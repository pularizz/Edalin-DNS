<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edalin-Dns</title>
  <link rel="icon" href="icon.jpg" type="image/jpeg">
<style>
  :root {
    --bg: #0a0607;
    --card: #191516;
    --card-border: #3a1214;
    --accent: #dc2626;
    --accent2: #8b0000;
    --text: #f8fafc;
    --subtext: #a89ea0;
    --muted: #6b6265;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Vazirmatn', 'Segoe UI', Tahoma, Arial, sans-serif;
    overflow-x: hidden;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 24px;
  }

  /* ---------- پس‌زمینه متحرک ---------- */
  .bg-glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.35;
    background: radial-gradient(circle, var(--accent), transparent 70%);
    animation: float 14s ease-in-out infinite;
  }
  .blob1 { width: 380px; height: 380px; top: -120px; left: -100px; animation-delay: 0s; }
  .blob2 { width: 320px; height: 320px; bottom: -100px; right: -80px; animation-delay: 3s;
            background: radial-gradient(circle, var(--accent2), transparent 70%); }
  .blob3 { width: 260px; height: 260px; top: 40%; left: 60%; animation-delay: 6s; opacity: 0.22; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -30px) scale(1.1); }
  }

  .particles span {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(220, 38, 38, 0.55);
    animation: rise linear infinite;
  }
  @keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100vh); opacity: 0; }
  }

  /* ---------- کارت اصلی ---------- */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 26px;
    padding: 34px 26px 28px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(220,38,38,0.04);
    animation: rise-in 0.7s cubic-bezier(.2,.8,.2,1) both;
    backdrop-filter: blur(6px);
  }
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .logo-wrap {
    width: 96px;
    height: 96px;
    margin: 0 auto 16px;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 0deg, var(--accent), #4a0d0d, var(--accent));
    animation: spin 6s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .logo-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: counter-spin 6s linear infinite;
  }
  @keyframes counter-spin {
    to { transform: rotate(-360deg); }
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #fff, #ffb4b4, #dc2626);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
    direction: ltr;
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }

  .subtitle {
    margin-top: 8px;
    font-size: 13.5px;
    color: var(--subtext);
    line-height: 1.9;
  }

  .badges {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 18px 0 22px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 11px;
    color: #ffb4b4;
    background: rgba(220,38,38,0.10);
    border: 1px solid rgba(220,38,38,0.25);
    padding: 5px 12px;
    border-radius: 999px;
  }

  .btns {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 4px;
  }
  .btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    color: #fff1f1;
    box-shadow: 0 8px 24px rgba(220,38,38,0.35);
  }
  .btn-primary:hover {
    box-shadow: 0 10px 30px rgba(220,38,38,0.55);
    transform: translateY(-2px);
  }
  .btn-primary::after {
    content: "";
    position: absolute;
    top: 0; right: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg);
    animation: sweep 2.6s ease-in-out infinite;
  }
  @keyframes sweep {
    0%   { right: -60%; }
    50%  { right: 130%; }
    100% { right: 130%; }
  }

  .btn-secondary {
    background: #221f20;
    color: #f1e6e6;
    border: 1px solid #4a1f21;
  }
  .btn-secondary:hover {
    background: #2c2728;
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .btn small {
    font-weight: 400;
    font-size: 11px;
    opacity: 0.75;
  }

  .icon-dl {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  footer {
    margin-top: 24px;
    font-size: 11px;
    color: var(--muted);
  }
  footer b { color: #8a7a7c; }

  @media (max-width: 400px) {
    .card { padding: 28px 18px 22px; }
  }
</style>
</head>

  </div>
